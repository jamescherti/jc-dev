---

actions:
  - path_match: "*/borgmachine"
    tags: install
    list_commands:
      - "cp {{ file | quote }} {{ '~/.bin/borgmachine' | expanduser }}"
      - "sudo cp {{ file | quote }} /usr/local/bin/borgmachine"

  - path_match:
      - "*"
    tags: install
    list_commands:
      - "rsync -av {{ cwd | quote }}/ {{ \"~/.bin/\" | expanduser }}"
