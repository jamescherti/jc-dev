target-version = "py310"
line-length = 88

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "D",   # pydocstyle
  "PTH", # flake8-use-pathlib
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific rules
  "PL",  # Pylint rules
  "A",   # flake8-builtins
  "S",   # flake8-bandit
  "RET", # flake8-return
  "TRY", # tryceratops
  "PT",  # flake8-pytest-style
  "TCH", # flake8-type-checking
]

ignore = [
  "ISC001",  # Prevent conflicts with the Ruff formatter
  "PLW2901", # For loop variable `pattern` overwritten by assignment target
  "PLR0915", # Pylint rules: Too many statements
  "PLR0912", # Pylint rules: Too many branches
]

[lint.pydocstyle]
convention = "pep257"
