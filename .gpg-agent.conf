# Forget the passphrase after 5 minutes (300 seconds) without use. Each use
# restarts this idle timer, but the 30-minute limit set by max-cache-ttl still
# applies.
default-cache-ttl 300

# Forget the passphrase 30 minutes (1800 seconds) after entry. Unlike
# default-cache-ttl, this timer never restarts on use, so even frequent signing
# or decryption eventually requires the passphrase again.
max-cache-ttl 1800

# pinentry-program /usr/bin/pinentry-tty
# pinentry-program /usr/bin/pinentry-curses
# pinentry-program /usr/bin/env pinentry-curses

# Connects gpg-agent to the OSX keychain via the brew-installed
# pinentry program from GPGtools. This is the OSX 'magic sauce',
# allowing the gpg key's passphrase to be stored in the login
# keychain, enabling automatic key signing.
